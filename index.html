<body>
<div id="shell">
  <div id="screenwrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="scanlines"></div>
    <div id="crtglow"></div>
  </div>
  <div id="hintbar">
    <span><b>Z</b>/<b>Enter</b> Confirm</span>
    <span><b>X</b>/<b>Shift</b> Cancel</span>
    <span><b>Arrows</b>/<b>WASD</b> Move</span>
    <span><b>C</b> Menu</span>
    <span><b>B</b> Emote</span>
    <span><b>/</b> Command Chat</span>
    <span><b>F</b> Fullscreen</span>
  </div>
</div>
<div id="chatoverlay" class="hidden">
  <div id="chatlog"></div>
  <div id="chatinputrow"><span id="chatprompt">&gt;</span><input id="chatinput" type="text" autocomplete="off" spellcheck="false" maxlength="120"></div>
</div>
<div id="adminpanel" class="hidden">
  <div class="apHead">■ SANDBOX MODE :: DEVELOPER TOOLS <button id="apClose">X</button></div>
  <div class="apBody" id="apBody"></div>
</div>
<div id="rotate" class="hidden">DIGITAL GENESIS needs a wider window.<br><br>Rotate your device, or widen the browser.</div>
